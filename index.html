<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="潘朵拉拾取班表">
<meta property="og:description" content="天堂W 首領聯合拾取班表">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>潘朵拉拾取班表</title>
<meta name="description" content="天堂W 首領聯合拾取班表（2026/9/14–10/4 新版草案）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
:root {
  --ground: #EDEFF2;
  --surface: #FAFBFC;
  --ink: #19202B;
  --muted: #586272;
  --rule: #D3D8E0;
  --accent: #8A5C10;
  --weekend: #B03C5A;
  --accent-soft: color-mix(in oklab, var(--accent) 12%, var(--surface));
  --col-sel: color-mix(in oklab, var(--accent) 9%, var(--ground));
  --shadow: 0 1px 0 rgba(20, 28, 40, .04), 0 12px 28px -16px rgba(20, 28, 40, .28);

  --g01: #2E6BD1;
  --g02: #C23A66;
  --g03: #C8741A;
  --g05: #0E8A7C;
  --g0607: #7B4CCF;
  --g08: #7E5A3A;
  --g09: #4B8A2A;

  --f-display: "Noto Serif TC", "Noto Serif KR", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "Noto Sans KR", "Microsoft JhengHei", "PingFang TC", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "Chakra Petch", "Noto Sans TC", "Noto Sans KR", ui-monospace, monospace;
}
:root[lang="ko"] {
  --f-display: "Noto Serif KR", "Noto Serif TC", "AppleMyungjo", "Batang", serif;
  --f-body: "Noto Sans KR", "Noto Sans TC", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-num: "Chakra Petch", "Noto Sans KR", "Noto Sans TC", ui-monospace, monospace;
}
:root[lang="ko"] body { word-break: keep-all; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1219;
    --surface: #171C26;
    --ink: #E3E7ED;
    --muted: #99A2B2;
    --rule: #283040;
    --accent: #D8A64D;
    --weekend: #E98CA3;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 16px 32px -18px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  --ground: #0F1219;
  --surface: #171C26;
  --ink: #E3E7ED;
  --muted: #99A2B2;
  --rule: #283040;
  --accent: #D8A64D;
  --weekend: #E98CA3;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 16px 32px -18px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 32px); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* group colour: every chip sets --g, tint and text derive from theme tokens */
[data-g="01"] { --g: var(--g01); }
[data-g="02"] { --g: var(--g02); }
[data-g="03"] { --g: var(--g03); }
[data-g="05"] { --g: var(--g05); }
[data-g="06+07"] { --g: var(--g0607); }
[data-g="08"] { --g: var(--g08); }
[data-g="09"] { --g: var(--g09); }

/* ---------- header ---------- */
.top {
  padding-block: 32px 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 40px;
}
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .16em; color: var(--muted); }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
h1 {
  margin: 2px 0 0;
  font: 900 clamp(36px, 6vw, 54px)/1.05 var(--f-display);
  letter-spacing: .04em;
  text-wrap: balance;
}
.stamp {
  display: inline-grid;
  place-items: center;
  padding: 4px 9px 5px;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  line-height: 1.25;
  text-align: center;
  transform: rotate(-4deg);
}
.meta { display: grid; gap: 4px; justify-items: end; color: var(--muted); font-size: 13px; }
.meta .range { font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: .02em; }
@media (max-width: 640px) { .meta { justify-items: start; } }
.lang {
  display: inline-flex;
  margin-bottom: 6px;
  padding: 3px;
  border: 1px solid var(--rule);
  border-radius: 7px;
  background: var(--surface);
}
.lang button {
  min-height: 38px;
  min-width: 64px;
  padding: 6px 12px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.lang button[lang="ko"] { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
.lang button[lang="zh-Hant"] { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }

/* ---------- group picker ---------- */
.picker { padding-block: 18px 6px; display: grid; gap: 8px; }
.picker-label { font-size: 12px; letter-spacing: .14em; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; border: 0; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span {
  display: flex;
  align-items: baseline;
  gap: 7px;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  transition: background-color .18s ease, border-color .18s ease;
}
.opt b { font: 600 16px/1 var(--f-num); color: color-mix(in oklab, var(--g, var(--ink)) 70%, var(--ink)); }
.opt small { font-size: 12px; color: var(--muted); }
.opt input:hover + span { border-color: color-mix(in oklab, var(--g, var(--ink)) 45%, var(--rule)); }
.opt input:checked + span {
  background: color-mix(in oklab, var(--g, var(--ink)) 14%, var(--surface));
  border-color: color-mix(in oklab, var(--g, var(--ink)) 70%, var(--surface));
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--g, var(--ink)) 70%, var(--surface));
}
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- board ---------- */
.board {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 28px;
  padding-block: 16px 40px;
  align-items: start;
}
@media (min-width: 980px) {
  .board { grid-template-columns: minmax(330px, 380px) minmax(0, 1fr); }
  .day { position: sticky; top: 16px; }
}

/* ---------- day panel ---------- */
.day {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.day-head {
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  padding: 12px 10px;
  border-bottom: 1px solid var(--rule);
}
.icon-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 0; border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background-color .15s ease, color .15s ease;
}
.icon-btn:hover:not(:disabled) { background: var(--ground); color: var(--ink); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.day-date { text-align: center; line-height: 1.15; }
.day-date .big { font-size: 30px; font-weight: 700; letter-spacing: .01em; }
.day-date .wd { font-size: 14px; color: var(--muted); margin-left: 6px; }
.day-date .wd.weekend { color: var(--weekend); }
.today-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--accent);
  color: var(--surface);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  vertical-align: 5px;
}
.day-status {
  margin: 0;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--muted);
  background: var(--accent-soft);
  border-bottom: 1px solid var(--rule);
}
.day-status strong { color: var(--ink); font-weight: 600; }
.day-actions { padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.copy-btn {
  width: 100%;
  min-height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 14px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--surface);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.copy-btn:hover { background: var(--ground); border-color: color-mix(in oklab, var(--accent) 45%, var(--rule)); }
.copy-btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.copy-btn.done { border-color: var(--accent); color: var(--accent); }
.slots { list-style: none; margin: 0; padding: 0; }
.slot {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 12px;
  padding: 12px 16px;
  border-top: 1px solid var(--rule);
  transition: opacity .2s ease;
}
.slot:first-child { border-top: 0; }
.slot-time { font-size: 17px; font-weight: 600; padding-top: 2px; line-height: 1.2; }
.slot-time small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.slot.past { opacity: .45; }
.slot.next .slot-time { color: var(--accent); }
.next-tag { display: block; font: 700 11px/1 var(--f-body); letter-spacing: .08em; color: var(--accent); margin-top: 4px; }
.evs { display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; transition: opacity .2s ease; }
.ev-name { font-weight: 500; line-height: 1.35; }
.ev-sub { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.kind {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  font-size: 11px;
  color: var(--muted);
  vertical-align: 2px;
}
.sigil {
  width: 46px; height: 50px;
  display: grid; justify-items: center; align-content: start;
  padding-top: 11px;
  clip-path: polygon(0 0, 100% 0, 100% 66%, 50% 100%, 0 66%);
  background: color-mix(in oklab, var(--g) 20%, var(--surface));
  color: color-mix(in oklab, var(--g) 66%, var(--ink));
  font: 700 13px/1 var(--f-num);
  letter-spacing: -.01em;
}
body.filtering .ev.dim { opacity: .32; }
body.filtering .ev.mine .sigil { background: color-mix(in oklab, var(--g) 34%, var(--surface)); }
body.filtering .ev.mine .ev-name { font-weight: 700; }

/* ---------- week ---------- */
.week-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--rule); }
h2 { margin: 0 0 10px; font: 700 22px/1.2 var(--f-display); letter-spacing: .04em; }
.tabs { display: flex; gap: 2px; }
.tab {
  min-height: 44px;
  padding: 10px 14px;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  background: transparent;
  color: var(--muted);
  font: 600 15px/1 var(--f-num);
  cursor: pointer;
  transition: color .15s ease, border-color .15s ease;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .w { font: 500 11px/1 var(--f-body); letter-spacing: .06em; margin-right: 5px; }

.scroll { overflow-x: auto; margin-top: 4px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 660px; }
thead th { padding: 0 3px; font-weight: 400; }
.dh {
  width: 100%;
  min-height: 52px;
  display: grid; place-items: center; align-content: center; gap: 1px;
  padding: 8px 0 6px;
  border: 0; border-bottom: 2px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: border-color .15s ease;
}
.dh:hover { border-bottom-color: var(--rule); }
.dh .wd { font-size: 13px; color: var(--muted); }
.dh .dd { font-size: 15px; font-weight: 600; }
.dh.weekend .wd, .dh.weekend .dd { color: var(--weekend); }
.dh.today .wd::after { content: attr(data-today); margin-left: 4px; font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
th.sel .dh { border-bottom-color: var(--accent); }
td.sel, th.sel { background: var(--col-sel); }
.corner { position: sticky; left: 0; z-index: 2; background: var(--ground); }
tbody th {
  position: sticky; left: 0; z-index: 1;
  width: 176px;
  padding: 10px 14px 10px 0;
  background: var(--ground);
  border-top: 1px solid var(--rule);
  text-align: left;
  font-weight: 400;
  vertical-align: middle;
}
.rn { display: block; font-weight: 600; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
.rs { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
.rk { display: block; font-size: 11px; color: var(--muted); opacity: .8; line-height: 1.4; }
tbody td { padding: 6px 3px; border-top: 1px solid var(--rule); text-align: center; vertical-align: middle; }
tr.daily td { padding-block: 10px; }
.chip {
  display: block;
  padding: 10px 0;
  border-radius: 5px;
  background: color-mix(in oklab, var(--g) 16%, var(--surface));
  color: color-mix(in oklab, var(--g) 66%, var(--ink));
  font: 600 14px/1 var(--f-num);
  letter-spacing: .01em;
  transition: opacity .2s ease, background-color .2s ease;
}
tr.daily .chip { padding: 14px 0; font-size: 15px; }
.none { color: var(--muted); opacity: .45; }
body.filtering .chip.dim { opacity: .26; }
body.filtering .chip.mine {
  background: color-mix(in oklab, var(--g) 32%, var(--surface));
  box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--g) 72%, var(--surface));
}

/* ---------- below the grid ---------- */
.under { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 28px; }
@media (min-width: 760px) { .under { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
h3 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.mine-list { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 0; }
.mine-list li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--rule); }
.mine-list li:first-child { border-top: 0; }
.mine-list .when { font-size: 14px; font-weight: 600; }
.mine-list .when small { display: block; font: 500 12px/1.3 var(--f-body); color: var(--muted); }
.mine-empty { margin: 0 0 22px; color: var(--muted); font-size: 14px; }

.pattern { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-bottom: 10px; max-width: 360px; }
.pattern span {
  padding: 9px 0 8px;
  text-align: center;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--rule);
}
.pattern span small { display: block; font: 500 10px/1.2 var(--f-num); color: var(--muted); margin-bottom: 3px; }
.pattern span.chip { border-color: transparent; font: 600 14px/1 var(--f-num); }
.rule-text { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 46ch; }
.rule-text .num { color: var(--ink); font-weight: 600; }

.tally { width: 100%; min-width: 0; border-collapse: collapse; font-size: 14px; }
.tally th, .tally td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--rule); }
.tally thead th { border-top: 0; font-size: 12px; font-weight: 500; color: var(--muted); vertical-align: bottom; line-height: 1.3; }
.tally th:first-child, .tally td:first-child { text-align: left; padding-left: 0; }
.tally td:first-child .chip { display: inline-block; width: 58px; text-align: center; padding: 6px 0; font-size: 13px; }
.tally .grp { border-left: 1px solid var(--rule); }
.tally tr.hl td { background: var(--accent-soft); }
.tally-note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

footer { padding-block: 8px 40px; }
footer p { margin: 0; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted); max-width: 90ch; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<headerclass="wrap top">
  <div>
    <p class="eyebrow" data-t="eyebrow">天堂W · 潘朵拉 · 首領聯合拾取</p>
    <div class="title-row">
      <h1 data-t="title">拾取班表</h1>
      <span class="stamp" data-t="stamp">新版草案<br>待確認</span>
    </div>
  </div>
  <div class="meta">
    <div class="lang" role="group" aria-label="語言 / 언어">
      <button type="button" id="lang-zh" data-lang="zh" lang="zh-Hant" aria-pressed="true">中文</button>
      <button type="button" id="lang-ko" data-lang="ko" lang="ko" aria-pressed="false">한국어</button>
    </div>
    <span class="range num">2026 / 9/14 – 10/4</span>
    <span data-t="tz">時間皆為台灣時間 · 韓國時間 +1 小時</span>
  </div>
</header>

<section class="wrap picker" aria-labelledby="picker-label">
  <span class="picker-label" id="picker-label" data-t="pick">看哪一團</span>
  <fieldset class="opts" id="opts"></fieldset>
</section>

<main class="wrap board">
  <aside class="day" id="day-panel" aria-label="當日首領">
    <div class="day-head">
      <button class="icon-btn" id="prev" type="button" aria-label="前一天"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="day-date" id="day-date" aria-live="polite"></div>
      <button class="icon-btn" id="next" type="button" aria-label="後一天"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <p class="day-status" id="day-status"></p>
    <div class="day-actions">
      <button type="button" class="copy-btn" id="copy-day"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span id="copy-label"></span></button>
      <span class="sr" id="copy-live" aria-live="polite"></span>
    </div>
    <ol class="slots" id="slots"></ol>
  </aside>

  <section aria-labelledby="week-title">
    <div class="week-head">
      <h2 id="week-title" data-t="week">一週總覽</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>
    <div class="scroll">
      <table id="grid">
        <caption class="sr" data-t="caption">每格是當天負責拾取的團</caption>
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="under">
      <div>
        <h3 id="mine-title"></h3>
        <div id="mine"></div>
        <h3 data-t="ruleTitle">怎麼輪的</h3>
        <div class="pattern" id="pattern"></div>
        <p class="rule-text" id="rule-text"></p>
      </div>
      <div>
        <h3 data-t="tallyTitle">分配統計</h3>
        <table class="tally" id="tally">
          <thead></thead>
          <tbody></tbody>
        </table>
        <p class="tally-note" data-t="tallyNote">傲塔/樂園以「天」計；世界首領以「隻」計，雙龍兩天分開算。</p>
      </div>
    </div>
  </section>
</main>

<footer class="wrap">
  <p data-t="footer"></p>
</footer>

<script>
(function () {
  var START = Date.UTC(2026, 8, 14);
  var NDAYS = 21;

    }).join("");
    document.querySelector("#tally thead").innerHTML = "<tr>" + t.tallyHead.map(function (h, k) {
      return "<th" + (k === 3 ? ' class="grp"' : "") + ">" + h + "</th>";
    }).join("") + "</tr>";

    var checked = state.group;
    var optHtml = '<legend class="sr">' + t.pick + '</legend>' +
      '<label class="opt"><input type="radio" name="grp" id="grp-all" value=""><span><b>' + t.all + '</b></span></label>';
    GROUPS.forEach(function (g) {
      var id = "grp-" + g.code.replace("+", "-");
      optHtml += '<label class="opt" data-g="' + g.code + '"><input type="radio" name="grp" id="' + id + '" value="' + g.code + '"><span><b>' + g.code + '</b><small>' + esc(g[state.lang]) + '</small></span></label>';
    });
    opts.innerHTML = optHtml;
    var input = document.getElementById(checked ? "grp-" + checked.replace("+", "-") : "grp-all");
    if (input) input.checked = true;
  }

  /* ---------- day panel ---------- */
  function renderDay() {
    var t = L(), i = state.day, wd = i % 7, now = taipeiNow(), isToday = now.idx === i;
    document.getElementById("day-date").innerHTML =
      '<span class="big num">' + md(i) + '</span>' +
      '<span class="wd' + (wd >= 5 ? " weekend" : "") + '">' + wdName(wd) + '</span>' +
      (isToday ? '<span class="today-tag">' + t.today + '</span>' : "");
    if (!copyTimer) copyLabel();
    document.getElementById("prev").disabled = i === 0;
    document.getElementById("next").disabled = i === NDAYS - 1;

    var evs = events(i), slots = [];
    evs.forEach(function (e) {
      var last = slots[slots.length - 1];
      if (last && last.t === e.t) last.items.push(e); else slots.push({ t: e.t, items: [e] });
    });
    var nextIdx = -1;
    if (isToday) slots.some(function (s, k) { if (mins(s.t) + 30 > now.min) { nextIdx = k; return true; } return false; });

    var html = "";
    slots.forEach(function (s, k) {
      var cls = "slot";
      if (isToday && (nextIdx === -1 || k < nextIdx)) cls += " past";
      if (k === nextIdx) cls += " next";
      html += '<li class="' + cls + '"><div class="slot-time num">' + tm(s.t) +
        '<small>' + t.otherTz + ' ' + tmOther(s.t) + '</small>' +
        (k === nextIdx ? '<span class="next-tag">' + (mins(s.t) <= now.min ? t.nowTag : t.nextTag) + '</span>' : "") +
        '</div><div class="evs">';
      s.items.forEach(function (e) {
        html += '<div class="ev' + chipCls(e.g) + '" data-g="' + e.g + '">' +
          '<div><div class="ev-name">' + esc(e.name) + (e.world ? '<span class="kind">' + t.world + '</span>' : "") + '</div>' +
          '<div class="ev-sub">' + esc(e.sub) + '</div></div>' +
          '<div class="sigil" aria-label="' + t.owner + ' ' + e.g + '">' + e.g + '</div></div>';
      });
      html += "</div></li>";
    });
    document.getElementById("slots").innerHTML = html;

    var status;
    if (state.group) {
      status = t.stGroup(state.group, evs.filter(function (e) { return e.g === state.group; }).length);
      if (isToday && nextIdx !== -1) status += " · " + countdown(slots[nextIdx].t, now.min);
    } else if (isToday) {
      status = nextIdx === -1 ? t.stDone : countdown(slots[nextIdx].t, now.min);
    } else {
      status = t.stOther(WEEKS[Math.floor(i / 7)].daily[wd], evs.filter(function (e) { return e.world; }).length);
    }
    document.getElementById("day-status").innerHTML = status;
  }

  function countdown(t, nowMin) {
    var diff = mins(t) - nowMin;
    if (diff <= 0) return L().stNow(tm(t));
    return L().stNext(tm(t), Math.floor(diff / 60), diff % 60);
  }

  /* ---------- week grid ---------- */
  function daysLabel(units) {
    var seen = [];
    units.forEach(function (k) { var d = L().wdn[WORLD[k].wd]; if (seen.indexOf(d) < 0) seen.push(d); });
    return seen.join(L().daySep);
  }

  function renderWeek() {
    var t = L(), w = state.week, W = WEEKS[w], base = w * 7, todayIdx = taipeiNow().idx, lang = state.lang, other = lang === "ko" ? "zh" : "ko";
    document.getElementById("tabs").innerHTML = WEEKS.map(function (_, k) {
      return '<button class="tab" type="button" role="tab" id="tab-' + k + '" aria-selected="' + (k === w) + '" data-w="' + k + '"><span class="w">' + t.tab(k) + '</span>' + md(k * 7) + '</button>';
    }).join("");

    var head = '<tr><th class="corner" scope="col"><span class="sr">Boss</span></th>';
    for (var d = 0; d < 7; d++) {
      var i = base + d, sel = i === state.day ? " sel" : "";
      head += '<th scope="col" class="' + sel + '"><button type="button" class="dh' + (d >= 5 ? " weekend" : "") + (i === todayIdx ? " today" : "") + '" data-day="' + i + '" aria-pressed="' + (i === state.day) + '">' +
        '<span class="wd" data-today="' + t.today + '">' + t.wdn[d] + '</span><span class="dd num">' + md(i) + '</span></button></th>';
    }
    document.querySelector("#grid thead").innerHTML = head + "</tr>";

    var body = "";
    ROWS.forEach(function (r) {
      var title, sub, alt;
      if (r.daily) {
        title = r.title[lang]; sub = r.sub[lang]; alt = r.title[other];
      } else {
        var u = WORLD[r.units[0]];
        title = u.row[lang];
        sub = (u.name[lang] !== title ? u.name[lang] + " · " : "") + daysLabel(r.units) + " " + tm(u.t);
        alt = u.row[other];
      }
      body += '<tr' + (r.daily ? ' class="daily"' : "") + '><th scope="row"><span class="rn">' + esc(title) + '</span><span class="rs">' + esc(sub) + '</span><span class="rk" lang="' + (other === "ko" ? "ko" : "zh-Hant") + '">' + esc(alt) + '</span></th>';
      for (var d = 0; d < 7; d++) {
        var g = "";
        if (r.daily) g = W.daily[d];
        else r.units.forEach(function (k) { if (WORLD[k].wd === d) g = W.world[k]; });
        var sel = base + d === state.day ? ' class="sel"' : "";
        body += "<td" + sel + ">" + (g ? '<span class="chip' + chipCls(g) + '" data-g="' + g + '">' + g + "</span>" : '<span class="none" aria-label="' + t.none + '">·</span>') + "</td>";
      }
      body += "</tr>";
    });
    document.querySelector("#grid tbody").innerHTML = body;
  }

  /* ---------- mine + tally ---------- */
  function renderMine() {
    var t = L(), w = state.week, W = WEEKS[w], G = state.group, el = document.getElementById("mine");
    document.getElementById("mine-title").textContent = t.mineTitle(G);
    if (!G) { el.innerHTML = '<p class="mine-empty">' + t.mineHint + '</p>'; return; }
    var items = [];
    for (var d = 0; d < 7; d++) {
      var i = w * 7 + d, when = '<span class="when num">' + md(i) + '<small>' + wdName(d) + '</small></span>';
      if (W.daily[d] === G) items.push("<li>" + when + "<span>" + t.mineDaily + '<br><span class="ev-sub">' + t.mineDailySub(tm) + "</span></span></li>");
      WORLD.forEach(function (u, k) {
        if (u.wd === d && W.world[k] === G) items.push("<li>" + when + "<span>" + esc(u.row[state.lang]) + '<br><span class="ev-sub">' + (u.name[state.lang] !== u.row[state.lang] ? esc(u.name[state.lang]) + " · " : "") + tm(u.t) + "</span></span></li>");
      });
    }
    el.innerHTML = items.length ? '<ul class="mine-list">' + items.join("") + "</ul>" : '<p class="mine-empty">' + t.mineNone(G) + "</p>";
  }

  function renderTally() {
    var w = state.week;
    function count(arr, g) { return arr.filter(function (x) { return x === g; }).length; }
    document.querySelector("#tally tbody").innerHTML = GROUPS.map(function (g) {
      var dw = count(WEEKS[w].daily, g.code), ww = count(WEEKS[w].world, g.code), dt = 0, wt = 0;
      WEEKS.forEach(function (W) { dt += count(W.daily, g.code); wt += count(W.world, g.code); });
      return '<tr' + (g.code === state.group ? ' class="hl"' : "") + '><td><span class="chip" data-g="' + g.code + '">' + g.code + '</span></td>' +
        '<td class="num">' + dw + '</td><td class="num">' + ww + '</td><td class="num grp">' + dt + '</td><td class="num">' + wt + "</td></tr>";
    }).join("");
  }

  function render() {
    document.body.classList.toggle("filtering", !!state.group);
    renderDay(); renderWeek(); renderMine(); renderTally();
  }

  function setDay(i) {
    clearTimeout(copyTimer); copyTimer = 0;
    state.day = Math.max(0, Math.min(NDAYS - 1, i));
    state.week = Math.floor(state.day / 7);
    render();
  }

  function setLang(lang) {
    state.lang = lang === "ko" ? "ko" : "zh";
    try { localStorage.setItem("pandora-lang", state.lang); } catch (err) {}
    try {
      var url = new URL(location.href);
      url.searchParams.set("lang", state.lang);
      history.replaceState(null, "", url);
    } catch (err) {}
    renderStatic();
    render();
  }

  var opts = document.getElementById("opts");
  opts.addEventListener("change", function (e) {
    state.group = e.target.value;
    try { localStorage.setItem("pandora-group", state.group); } catch (err) {}
    render();
  });
  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (b) setLang(b.getAttribute("data-lang"));
  });
  document.getElementById("copy-day").addEventListener("click", function () {
    var btn = this, live = document.getElementById("copy-live");
    copyText(dayText(state.day)).then(function () {
      clearTimeout(copyTimer);
      btn.classList.add("done");
      document.getElementById("copy-label").textContent = L().copied;
      live.textContent = L().copied;
      copyTimer = setTimeout(function () { copyTimer = 0; copyLabel(); live.textContent = ""; }, 2500);
    }, function () {
      document.getElementById("copy-label").textContent = L().copyFail;
      live.textContent = L().copyFail;
    });
  });
  document.getElementById("prev").addEventListener("click", function () { setDay(state.day - 1); });
  document.getElementById("next").addEventListener("click", function () { setDay(state.day + 1); });
  document.getElementById("grid").addEventListener("click", function (e) {
    var b = e.target.closest("[data-day]");
    if (b) setDay(+b.getAttribute("data-day"));
  });
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-w]");
    if (b) setDay(+b.getAttribute("data-w") * 7 + (state.day % 7));
  });

  try { var saved = localStorage.getItem("pandora-group"); if (saved !== null && (saved === "" || GROUPS.some(function (g) { return g.code === saved; }))) state.group = saved; } catch (err) {}
  // language: ?lang= link first, then last choice, then browser language
  var lang = null;
  try { lang = new URL(location.href).searchParams.get("lang"); } catch (err) {}
  if (lang !== "ko" && lang !== "zh") {
    try { lang = localStorage.getItem("pandora-lang"); } catch (err) {}
  }
  if (lang !== "ko" && lang !== "zh") lang = /^ko\b/i.test(navigator.language || "") ? "ko" : "zh";
  state.lang = lang;
  renderStatic();
  setDay(taipeiNow().idx);
  setInterval(function () { if (taipeiNow().idx === state.day) renderDay(); }, 30000);
})();
</script>
</body>
</html>
